<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokeBall</title>
<meta name="description" content="Draft Pokémon into a 22-man football roster and coach them through a season.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Graduate&display=swap">
<style>
/* Layout: a night game under the lights. Turf-green ground, chalk text, one Poké-red accent,
   amber reserved for scoreboard numerals. Varsity block type for names, condensed sans for data. */
:root {
  --turf: #12382a;
  --turf-2: #184533;
  --turf-3: #20573f;
  --turf-deep: #0d2b20;
  --chalk: #eef2e6;
  --chalk-dim: #a7bba9;
  --line: rgba(238, 242, 230, 0.14);
  --red: #e5402b;
  --red-ink: #fff4ef;
  --amber: #ffb547;
  --good: #7fdc93;
  --warn: #ffd166;
  --bad: #ff8a7a;
  --field: #2f7a45;
  --field-2: #2a6f3f;
  --f-display: 'Graduate', 'Rockwell', 'Georgia', serif;
  --f-body: 'Barlow', 'Segoe UI', system-ui, sans-serif;
  --f-data: 'Barlow Condensed', 'Arial Narrow', 'Barlow', system-ui, sans-serif;
  --r: 6px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--turf); color: var(--chalk); }
body { font: 15px/1.5 var(--f-body); padding-inline: 16px; padding-block: 0 48px; }
main { max-width: 1240px; margin: 0 auto; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
h1 { font: 400 clamp(26px, 4vw, 40px)/1.1 var(--f-display); letter-spacing: 0.01em; }
h2 { font: 400 22px/1.2 var(--f-display); }
h3 { font: 600 15px/1.3 var(--f-data); text-transform: uppercase; letter-spacing: 0.08em; color: var(--chalk-dim); display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
h4 { font: 600 13px/1.3 var(--f-data); text-transform: uppercase; letter-spacing: 0.08em; color: var(--chalk-dim); margin-top: 12px; }
p { margin: 0; }
.eyebrow { font: 600 13px/1.2 var(--f-data); text-transform: uppercase; letter-spacing: 0.12em; color: var(--amber); }
.lede { max-width: 62ch; color: var(--chalk-dim); }
.muted { color: var(--chalk-dim); }
.small { font-size: 13px; }
.mono, .num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; width: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
  max-width: 1240px; margin: 0 auto 20px; padding-block: 12px; background: var(--turf); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; font: 400 22px/1 var(--f-display); padding: 0; }
.ball { width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(var(--red) 0 46%, var(--turf-deep) 46% 54%, var(--chalk) 54%);
  box-shadow: inset 0 0 0 2px var(--turf-deep); position: relative; }
.ball::after { content: ''; position: absolute; inset: 7px; border-radius: 50%; background: var(--chalk); box-shadow: 0 0 0 2px var(--turf-deep); }
.top nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav { background: none; border: 0; border-radius: var(--r); padding: 6px 10px; cursor: pointer; color: var(--chalk-dim); font: 600 14px/1 var(--f-data); text-transform: uppercase; letter-spacing: 0.08em; }
.nav:hover { color: var(--chalk); background: var(--turf-2); }
.nav.on { color: var(--chalk); box-shadow: inset 0 -2px 0 var(--red); border-radius: 0; }

/* Shared */
.card { background: var(--turf-2); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.btn { background: var(--turf-3); border: 1px solid var(--line); border-radius: var(--r); padding: 9px 14px; cursor: pointer; font: 600 15px/1 var(--f-data); letter-spacing: 0.04em; text-transform: uppercase; }
.btn:hover:not(:disabled) { border-color: var(--chalk-dim); }
.btn.primary { background: var(--red); border-color: var(--red); color: var(--red-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.tiny { padding: 6px 10px; font-size: 13px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spr { image-rendering: pixelated; object-fit: contain; display: inline-block; vertical-align: middle; }
.spr.xs { width: 22px; height: 22px; }
.spr.sm { width: 34px; height: 34px; }
.spr.md { width: 44px; height: 44px; }
.spr.lg { width: 84px; height: 84px; }
.type { display: inline-block; font: 600 11px/1 var(--f-data); text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 6px 2px; border-radius: 3px;
  background: color-mix(in srgb, var(--tc) 30%, var(--turf-deep)); color: var(--chalk); border: 1px solid color-mix(in srgb, var(--tc) 70%, transparent); }
.types { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.ovr { font: 700 16px/1 var(--f-data); font-variant-numeric: tabular-nums; min-width: 28px; text-align: center; padding: 3px 4px; border-radius: 3px; }
.ovr.elite { background: var(--amber); color: var(--turf-deep); }
.ovr.good { color: var(--good); }
.ovr.ok { color: var(--chalk); }
.ovr.low { color: var(--chalk-dim); }
.slot { font: 700 12px/1 var(--f-data); letter-spacing: 0.06em; color: var(--chalk-dim); min-width: 32px; display: inline-block; }
.tbadge { display: inline-block; font: 700 12px/1 var(--f-data); letter-spacing: 0.06em; padding: 3px 5px; border-radius: 3px; background: var(--team); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.35); }
.bar { display: inline-block; flex: 1; height: 6px; background: var(--turf-deep); border-radius: 3px; overflow: hidden; min-width: 40px; }
.bar span { display: block; height: 100%; background: var(--chalk-dim); }
.tablewrap { overflow-x: auto; min-width: 0; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: left; font: 600 12px/1.2 var(--f-data); text-transform: uppercase; letter-spacing: 0.08em; color: var(--chalk-dim); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th.num, td.num { text-align: right; }
input, select { background: var(--turf-deep); border: 1px solid var(--line); color: var(--chalk); border-radius: var(--r); padding: 8px 10px; font: inherit; min-width: 0; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--chalk-dim); }
label.check { flex-direction: row; align-items: center; gap: 8px; color: var(--chalk); font-size: 14px; }
fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }
legend { font-size: 13px; color: var(--chalk-dim); margin-bottom: 4px; }
.pill { flex-direction: row; align-items: center; gap: 6px; background: var(--turf-deep); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; color: var(--chalk); cursor: pointer; }
.pill:has(input:checked) { border-color: var(--amber); }

/* Home */
.home { display: grid; gap: 28px; }
.hero { display: grid; gap: 12px; padding-block: 12px 4px; }
.hero h1 { font-size: clamp(32px, 6vw, 60px); }
.showcase { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.showcase figure { margin: 0; display: grid; justify-items: center; gap: 2px; background: var(--turf-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px 8px; min-width: 96px; }
.showcase .spr { width: 64px; height: 64px; }
.showcase figcaption { font: 600 14px/1.2 var(--f-data); display: grid; justify-items: center; }
.showcase figcaption b { color: var(--amber); letter-spacing: 0.04em; }
.cards { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; align-items: start; }
.row2 { display: grid; grid-template-columns: 1fr 110px; gap: 10px; }
.setup .btn.primary { align-self: flex-start; margin-top: 6px; }
.side .btn { align-self: flex-start; }
.side .saveslots .btn { align-self: center; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--red-ink); }
.btn.ghost { background: none; color: var(--chalk-dim); }
.saveslots { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.saveslots .sslot { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 4px 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--turf); }
.saveslots .sslot.on { border-color: var(--chalk-dim); }
.saveslots .sslot.empty { opacity: 0.7; }
.saveslots .sn { font: 700 20px/1 var(--f-data); color: var(--amber); text-align: center; }
.saveslots .si { display: grid; gap: 2px; min-width: 0; }
.saveslots .si b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.saveslots .actions { grid-column: 2; gap: 6px; }

/* Draft */
.draft { display: grid; gap: 16px; }
.draft-head { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; justify-content: space-between; }
.clockbox { display: flex; gap: 8px; align-items: baseline; font: 600 14px/1 var(--f-data); color: var(--chalk-dim); text-transform: uppercase; letter-spacing: 0.06em; }
.clockbox .clocknum { font: 700 40px/1 var(--f-data); color: var(--amber); font-variant-numeric: tabular-nums; }
.dots::after { content: '...'; animation: dots 1s steps(3) infinite; display: inline-block; width: 1.2em; overflow: hidden; vertical-align: bottom; }
@keyframes dots { from { width: 0; } to { width: 1.2em; } }
.draft-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters input { flex: 1 1 160px; }
.board .tablewrap { max-height: 70vh; overflow: auto; }
.board-table thead th { position: sticky; top: 0; background: var(--turf-2); z-index: 1; }
.board-table tr { cursor: pointer; }
.board-table tbody tr:hover { background: var(--turf-3); }
.board-table tr.sel { background: color-mix(in srgb, var(--red) 18%, var(--turf-2)); }
.board-table td { padding: 4px 6px; }
.board-table td.num { font-size: 15px; }
.pk { display: flex; gap: 8px; align-items: center; min-width: 190px; }
.pk > span { display: grid; gap: 2px; }
.pk b { font-weight: 600; }
.leg { font: 600 11px/1 var(--f-data); color: var(--amber); text-transform: uppercase; letter-spacing: 0.08em; font-style: normal; }
.fit { white-space: nowrap; }
.sort { background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
.sort.on { color: var(--amber); }
.empty { text-align: center; padding: 24px; color: var(--chalk-dim); }
.draft-side { display: grid; gap: 16px; }
.dhead { display: flex; gap: 12px; align-items: center; }
.dhead h3 { font: 400 20px/1.1 var(--f-display); color: var(--chalk); text-transform: none; letter-spacing: 0; }
.best { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.best li { display: flex; gap: 8px; align-items: center; }
.draftto { display: grid; gap: 8px; }
.slots { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.slots ul, .slots li { min-width: 0; }
.slots ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; }
.slots li { display: flex; gap: 4px; align-items: center; font-size: 13px; min-height: 24px; }
.slots li > span:nth-child(3) { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slots .ovr { font-size: 13px; min-width: 22px; padding: 1px 2px; }
.feed { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.feed li { display: flex; gap: 6px; align-items: center; font-size: 14px; }
.feed li > span:not(.tbadge) { flex: 1; }
.feed em { font: 700 12px/1 var(--f-data); color: var(--chalk-dim); font-style: normal; }

/* Grades */
.grades, .depth, .season, .game { display: grid; gap: 16px; }
.gtable tr.me td, .stand tr.me td { background: color-mix(in srgb, var(--red) 14%, transparent); }
.grade { font: 700 17px/1 var(--f-data); display: inline-block; min-width: 30px; }
.g-A { color: var(--good); }
.g-B { color: var(--chalk); }
.g-C { color: var(--warn); }
.g-D, .g-F { color: var(--bad); }

/* Depth chart */
.unitbar { display: flex; gap: 24px; flex-wrap: wrap; }
.unitbar div { display: grid; }
.unitbar b { font: 700 26px/1 var(--f-data); color: var(--amber); }
.gridwrap { overflow-x: auto; border-radius: var(--r); }
.gridiron { position: relative; min-width: 760px; display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 10px 6px; align-items: start;
  padding: 34px 14px; border: 1px solid rgba(255,255,255,.18); border-radius: var(--r);
  background: repeating-linear-gradient(180deg, transparent 0 62px, rgba(255,255,255,.16) 62px 64px), linear-gradient(180deg, var(--field-2) 50%, var(--field) 50%) 0 0 / 100% 128px; }
.gridiron .dslot { width: auto; min-width: 0; padding: 5px 3px; }
.gridiron .los { grid-column: 1 / -1; grid-row: 4; height: 3px; margin: 4px 0; background: #4aa3ff; box-shadow: 0 0 8px rgba(74,163,255,.6); }
.gunit { display: none; }
/* Phones: the 11-column field does not fit, so the lineup stacks by unit, four slots a row. */
@media (max-width: 560px) {
  .gridiron { min-width: 0; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 12px 10px; gap: 8px 6px; }
  .gridiron .dslot { grid-column: auto !important; grid-row: auto !important; width: auto; }
  .gridiron .los, .gridiron .gside { display: none; }
  .gunit { display: block; grid-column: 1 / -1; margin: 6px 0 0; font: 700 12px/1 var(--f-data); letter-spacing: 0.08em; text-transform: uppercase; color: var(--chalk); }
  .gunit.off { order: 1; } .dslot.off { order: 2; }
  .gunit.def { order: 3; } .dslot.def { order: 4; }
  .gunit.st { order: 5; } .dslot.st { order: 6; }
}
.gside { position: absolute; left: 14px; font: 700 12px/1 var(--f-data); letter-spacing: 0.08em; text-transform: uppercase; color: var(--chalk); }
.gside.def { top: 12px; }
.gside.off { bottom: 12px; }
.dslot { display: grid; justify-items: center; gap: 2px; background: rgba(13, 43, 32, 0.78); border: 1px solid var(--line); border-radius: var(--r); padding: 6px; width: 92px; cursor: pointer; text-align: center; }
.dslot:hover { border-color: var(--chalk-dim); }
.dslot.sel { border-color: var(--amber); box-shadow: 0 0 0 2px var(--amber); }
.dslot .dn { font: 600 13px/1.1 var(--f-data); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fitnote { font: 600 10px/1.1 var(--f-data); color: var(--warn); text-transform: uppercase; }
.role { display: block; font: 600 10px/1.1 var(--f-data); letter-spacing: 0.05em; text-transform: uppercase; color: var(--chalk-dim); }
.role.flex { color: var(--good); }
.role.wild { color: var(--amber); }
.pk .role, .dhead .role { margin-top: 1px; }
.benchrow { display: flex; gap: 8px; flex-wrap: wrap; }

/* Season */
.season-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.col { display: grid; gap: 16px; min-width: 0; }
.vs { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.at { font: 400 16px/1 var(--f-display); color: var(--chalk-dim); }
.tblock { display: flex; gap: 10px; align-items: center; font-weight: 600; }
.tabbr { font: 400 22px/1 var(--f-display); background: var(--team); color: #fff; padding: 8px 10px 6px; border-radius: var(--r); text-shadow: 0 1px 0 rgba(0,0,0,.35); }
.results { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.results li { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.results em { font: 600 12px/1 var(--f-data); color: var(--chalk-dim); font-style: normal; min-width: 44px; text-transform: uppercase; }
.results em.po { color: var(--amber); }
.results b { font-family: var(--f-data); font-size: 17px; }
.results b.won { color: var(--amber); }
.stand tr.cut td { border-bottom: 2px solid var(--amber); }
.leaders { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 4px 16px; }
.leaders ol { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 4px; }
.leaders li { display: flex; gap: 6px; align-items: center; font-size: 14px; }
.leaders li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.leaders em { font: 600 11px/1 var(--f-data); color: var(--chalk-dim); font-style: normal; }
.leaders b { font-family: var(--f-data); min-width: 38px; text-align: right; }
.champ h2 { color: var(--amber); }
.champrow { display: flex; gap: 6px; flex-wrap: wrap; }

/* Game */
.scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; background: var(--turf-deep); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; gap: 6px 12px; }
.sb-team { display: flex; align-items: center; gap: 12px; }
.sb-team.home { justify-content: flex-end; }
.sb-abbr { font: 400 22px/1 var(--f-display); background: var(--team); color: #fff; padding: 7px 9px 5px; border-radius: 4px; text-shadow: 0 1px 0 rgba(0,0,0,.35); }
.sb-score { font: 700 46px/1 var(--f-data); color: var(--amber); font-variant-numeric: tabular-nums; min-width: 1.4em; text-align: center; }
.possdot { width: 10px; height: 10px; border-radius: 50%; background: var(--chalk); box-shadow: 0 0 0 3px rgba(238,242,230,.25); }
.sb-mid { display: grid; justify-items: center; font-family: var(--f-data); }
.sb-q { font: 600 14px/1 var(--f-data); color: var(--chalk-dim); letter-spacing: 0.1em; }
.sb-clock { font: 700 30px/1.1 var(--f-data); color: var(--amber); font-variant-numeric: tabular-nums; }
.sb-info { grid-column: 1 / -1; text-align: center; font: 600 15px/1.2 var(--f-data); letter-spacing: 0.04em; color: var(--chalk); text-transform: uppercase; }
.fieldwrap { overflow: hidden; border-radius: var(--r); }
.field { position: relative; width: 100%; aspect-ratio: 120 / 53.3; max-width: 100%;
  background: repeating-linear-gradient(90deg, var(--field) 0 4.1667%, var(--field-2) 4.1667% 8.3333%); border: 2px solid rgba(255,255,255,.55); }
.ez { position: absolute; top: 0; bottom: 0; width: 8.3333%; background: color-mix(in srgb, var(--team) 75%, #000); display: grid; place-items: center; }
.ez.left { left: 0; } .ez.right { right: 0; }
.ez span { font: 400 clamp(10px, 2vw, 22px)/1 var(--f-display); color: rgba(255,255,255,.85); writing-mode: vertical-rl; }
.ez.left span { transform: rotate(180deg); }
.yl { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px solid rgba(255,255,255,.4); }
.yl em { position: absolute; bottom: 4%; left: 0; transform: translateX(-50%); font: 700 clamp(8px, 1.4vw, 14px)/1 var(--f-data); color: rgba(255,255,255,.65); font-style: normal; }
.losline { position: absolute; top: 0; bottom: 0; width: 0; border-left: 3px solid rgba(80, 150, 255, .85); transform: translateX(-1px); }
.firstline { position: absolute; top: 0; bottom: 0; width: 0; border-left: 3px solid var(--amber); transform: translateX(-1px); }
.fp { position: absolute; transform: translate(-50%, -50%); width: clamp(18px, 3.3vw, 38px); height: clamp(18px, 3.3vw, 38px); border-radius: 50%;
  background: color-mix(in srgb, var(--team) 55%, rgba(0,0,0,.4)); box-shadow: 0 0 0 2px var(--team); display: grid; place-items: center; transition: left .7s ease-out, top .7s ease-out; }
.fp .spr { width: 115%; height: 115%; }
.fp.def { box-shadow: 0 0 0 2px var(--team), 0 0 0 3px rgba(0,0,0,.4); }
.fp.carrier { z-index: 3; box-shadow: 0 0 0 3px var(--amber); }
.football { position: absolute; width: clamp(8px, 1.2vw, 14px); height: clamp(5px, .8vw, 9px); background: #8a4b22; border-radius: 50%; transform: translate(-50%, -50%);
  box-shadow: 0 0 0 1px #fff; z-index: 4; transition: left .7s ease-out, top .7s ease-out; }
.lastplay { background: var(--turf-2); border: 1px solid var(--line); border-left: 4px solid var(--chalk-dim); border-radius: var(--r); padding: 10px 14px; display: grid; gap: 4px; font-size: 16px; }
.lastplay.td { border-left-color: var(--amber); }
.lastplay.to { border-left-color: var(--red); }
.lastplay.sack { border-left-color: var(--bad); }
.lastplay.big { border-left-color: var(--good); }
.calls { font: 600 12px/1 var(--f-data); color: var(--chalk-dim); text-transform: uppercase; letter-spacing: 0.08em; }
mark { background: var(--amber); color: var(--turf-deep); padding: 0 4px; border-radius: 3px; font-weight: 600; }
.callhead { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.callhead h3 { color: var(--chalk); font-size: 17px; }
.plays { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }

/* Season tools: scouting, matchups, trades, health */

/* Scheme pick on the setup form, the call sheet's scheme tag */

/* Weekly hooks: the week in review, power ranking */

/* Bracket, awards, history, results */

.bteam.won b, .champcol .bteam.won span { color: var(--amber); }

.awards li { display: flex; gap: 10px; align-items: center; }
.awards li > span { display: grid; gap: 2px; justify-items: start; }

.history li { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }

.result { display: grid; gap: 16px; }

/* Offseason */
.offseason { display: grid; gap: 16px; }

/* Game: pre-snap board, tendencies, subs */

.subslot { display: flex; gap: 6px; align-items: center; flex: 1; background: var(--turf-deep); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; cursor: pointer; text-align: left; font-size: 14px; }

/* Free agency */

/* Record book and rivalries */

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.rivalry { background: linear-gradient(100deg, color-mix(in srgb, var(--ta) 22%, var(--turf-2)), var(--turf-2) 45%, var(--turf-2) 55%, color-mix(in srgb, var(--tb) 22%, var(--turf-2))); }
.rv-head { display: flex; gap: 10px; align-items: center; justify-content: center; }

  .board-table .a-arm, .board-table .a-sta, .board-table .a-blk, .board-table .a-tkl, .board-table .a-acl, .board-table .a-agi, .board-table .a-awr, .board-table .a-kpw, .board-table .a-kac { display: none; }
}

}

/* 3D field */
.stage-slot { min-height: clamp(320px, 62vh, 720px); }
.stagewrap { position: relative; height: clamp(320px, 62vh, 720px); border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: #0b1a2a; touch-action: none; user-select: none; }
.stage, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 8px; align-items: start; padding: 10px 12px; }
.hud-call { justify-self: start; font: 600 14px/1 var(--f-data); text-transform: uppercase; letter-spacing: 0.08em; background: rgba(13, 43, 32, 0.78); padding: 7px 10px; border-radius: 4px; }

.hud-flash { align-self: center; justify-self: center; font: 400 clamp(28px, 6vw, 56px)/1 var(--f-display); color: var(--chalk); text-shadow: 0 3px 0 rgba(0,0,0,0.55); opacity: 0; transform: scale(0.9); transition: opacity 0.18s, transform 0.18s; }
.hud-flash.on { opacity: 1; transform: scale(1); }
.hud-flash.on.td { animation: fl-td 1.5s ease-out; } .hud-flash.on.to { animation: fl-to 0.6s ease-out; } .hud-flash.on.big { animation: fl-pop 0.5s ease-out; }
@keyframes fl-td { 0% { transform: scale(0.4); letter-spacing: 0.4em; } 25% { transform: scale(1.15); } 40% { transform: scale(1); letter-spacing: 0.05em; } }
@keyframes fl-to { 0% { transform: translateX(-30px) scale(1.2); } 30% { transform: translateX(12px); } 55% { transform: translateX(-6px); } 100% { transform: none; } }

.hud-flash.to { color: var(--bad); }

.hud-flash.on.power { animation: fl-pop 0.5s ease-out; }
.hud-tip { justify-self: end; font: 600 14px/1.2 var(--f-data); letter-spacing: 0.06em; background: rgba(13, 43, 32, 0.8); padding: 7px 12px; border-radius: 4px; text-align: right; white-space: pre-line; }
.touch, .touch-top { display: none; }
@media (pointer: coarse) {
  .touch { display: flex; position: absolute; inset: auto 0 44px 0; justify-content: space-between; align-items: flex-end; padding: 0 12px; pointer-events: none; }
  .touch[data-mode="idle"] { display: none; }
  .tleft { pointer-events: auto; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .stick { width: 96px; height: 96px; border-radius: 50%; background: rgba(238, 242, 230, 0.12); border: 2px solid rgba(238, 242, 230, 0.35); display: grid; place-items: center; touch-action: none; }
  .stick span { width: 42px; height: 42px; border-radius: 50%; background: rgba(238, 242, 230, 0.55); }
  .tbtns { pointer-events: auto; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .touch button, .touch-top button { background: rgba(13, 43, 32, 0.82); border: 1px solid rgba(238, 242, 230, 0.4); border-radius: 6px; padding: 10px 12px; font: 600 14px/1 var(--f-data); text-transform: uppercase; touch-action: none; user-select: none; -webkit-user-select: none; }
  .trow { display: flex; gap: 4px; }
  .trow button { padding: 10px 11px; }
  .touch .t-main { padding: 14px 16px; }
  .touch.lob .t-lob { background: var(--amber); color: #10241a; border-color: var(--amber); }
  .touch:not([data-mode="pass"]) .t-pass, .touch[data-mode="pass"] .t-run, .touch[data-mode="pre"] .t-sprint { display: none; }
  .touch[data-mode="watch"] .tleft, .touch[data-mode="watch"] .tbtns { visibility: hidden; }
  .touch-top { display: flex; gap: 6px; position: absolute; top: 56px; right: 12px; }
  .touch-top .t-live { display: none; }
  .touch:not([data-mode="idle"]) ~ .touch-top .t-live { display: inline-block; }
}
/* The 3D game: the stadium fills the viewport under the top bar, with a broadcast scoreboard,
   a corner menu, a compact call sheet between plays and the game details below the fold.
   The no-WebGL field keeps the plain stack. */
body.g3d-on { padding-inline: 0; }
body.g3d-on .top { max-width: none; margin-bottom: 0; padding-inline: 16px; }
body.g3d-on main { max-width: none; }
.game.g3d { gap: 0; }
.game.g3d .stage-slot { position: relative; display: grid; grid-template: minmax(0, 1fr) / minmax(0, 1fr); min-height: 0;
  height: max(360px, calc(100vh - var(--top-h, 60px)));
  height: max(360px, calc(100dvh - var(--top-h, 60px))); }
.game.g3d .stage-slot > * { grid-area: 1 / 1; }
.game.g3d .stagewrap { height: 100%; border-radius: 0; border: 0; border-bottom: 1px solid var(--line); }
.game.g3d .below { max-width: 1240px; width: 100%; margin: 0 auto; padding: 16px 16px 0; display: grid; gap: 12px; }
.glass { background: rgba(9, 22, 17, 0.78); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(238, 242, 230, 0.16); }
/* Broadcast scoreboard */
.bcast { align-self: start; justify-self: center; z-index: 3; margin-top: 12px; display: flex; align-items: stretch; height: 42px; border-radius: 6px; overflow: hidden;
  background: rgba(9, 22, 17, 0.86); backdrop-filter: blur(8px); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35); font-family: var(--f-data); pointer-events: none; max-width: calc(100% - 200px); }
.bc-team { display: flex; align-items: center; gap: 10px; padding: 0 12px 0 0; background: linear-gradient(90deg, var(--team) 0 52px, rgba(255,255,255,0.04) 52px); position: relative; }
.bc-abbr { width: 52px; text-align: center; font: 400 18px/1 var(--f-display); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,0.4); }
.bc-score { font: 700 26px/1 var(--f-data); color: var(--chalk); min-width: 1.3em; text-align: center; font-variant-numeric: tabular-nums; }
.bc-poss { width: 14px; height: 9px; border-radius: 50%; background: #b8612a; box-shadow: 0 0 0 1.5px #fff; position: absolute; right: 3px; top: 50%; margin-top: -4.5px;
  background-image: linear-gradient(90deg, transparent 6px, #fff 6px 8px, transparent 8px); }
.bc-team.has { box-shadow: inset 0 -3px 0 var(--team); }
.bc-team { padding-right: 20px; }
.bc-team.has .bc-score { color: var(--amber); }
.bc-team.scored .bc-score { animation: score-pop 1.1s ease-out 2; }
@keyframes score-pop { 0% { transform: scale(1); color: #fff; } 25% { transform: scale(1.45); color: #ffe27a; text-shadow: 0 0 12px #ffd23f; } 100% { transform: scale(1); } }
.bc-cell { display: grid; place-items: center; padding: 0 12px; font: 600 17px/1 var(--f-data); letter-spacing: 0.04em; color: var(--chalk); border-left: 1px solid rgba(238,242,230,0.12); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bc-q { display: flex; align-items: baseline; color: #fff; font-weight: 700; background: rgba(238,242,230,0.1); }
.bc-q small { font-size: 11px; color: var(--chalk-dim); margin-left: 4px; letter-spacing: 0.08em; }
.bc-clock { font-size: 20px; color: var(--amber); }
.bc-down { background: rgba(255, 210, 31, 0.12); color: #ffe27a; text-transform: uppercase; }
.bc-pc { font-size: 15px; color: var(--chalk-dim); min-width: 46px; }
.bc-pc.low { color: #ffcf66; animation: pc-warn 1s ease-in-out infinite; }
@keyframes pc-warn { 50% { background: rgba(255, 207, 102, 0.14); } }
.bc-spot { color: var(--chalk-dim); font-size: 15px; text-transform: uppercase; }
/* Menu */
.menubtn { align-self: start; justify-self: end; z-index: 4; margin: 12px 12px 0 0; display: flex; gap: 8px; align-items: center; cursor: pointer; border-radius: 6px; padding: 9px 12px;
  background: rgba(9, 22, 17, 0.8); border: 1px solid rgba(238,242,230,0.18); font: 600 14px/1 var(--f-data); text-transform: uppercase; letter-spacing: 0.08em; }
.menubtn kbd { font-size: 11px; }
.gmenu { align-self: start; justify-self: end; z-index: 5; margin: 60px 12px 0 0; width: min(290px, calc(100% - 24px)); max-height: calc(100% - 140px); overflow-y: auto; display: grid; gap: 5px; padding: 10px 12px; font-size: 14px;
  background: rgba(9, 22, 17, 0.94); backdrop-filter: blur(8px); }
.gmenu h4 { margin-top: 6px; display: flex; gap: 8px; align-items: center; }
.gm-row { display: flex; flex-wrap: wrap; gap: 6px; }
.gm-row .btn.on { background: var(--amber); color: #1b1408; border-color: var(--amber); }
.gmenu .keys { margin-top: 6px; }
.gmenu .keygrid { grid-template-columns: 1fr; font-size: 13px; }
/* Last play */
.ticker { align-self: start; justify-self: start; z-index: 3; margin: 12px 0 0 12px; max-width: min(340px, calc(50% - 260px)); padding: 7px 10px; border-radius: 6px;
  background: rgba(9, 22, 17, 0.78); border-left: 3px solid var(--chalk-dim); font-size: 13px; line-height: 1.35; pointer-events: none; }
.ticker .tk-label { display: block; font: 600 11px/1.2 var(--f-data); text-transform: uppercase; letter-spacing: 0.1em; color: var(--chalk-dim); }
.ticker.td { border-color: var(--amber); } .ticker.to, .ticker.sack { border-color: var(--bad); } .ticker.big { border-color: var(--good); }
.ticker mark { background: none; color: var(--amber); }
.ticker { transition: opacity 0.6s, transform 0.6s; }
.ticker.gone { opacity: 0; transform: translateY(-8px); }
/* Play call: a compact strip of play cards docked at the bottom, sized to its contents. Each
   card is a real play diagram (routes, run lane, blocks; zones, man and rush for the defense)
   with the play's name under it. X opens the whole playbook. */
.callsheet { align-self: end; justify-self: center; z-index: 3; margin: 0 12px 10px; width: auto; max-width: calc(100% - 24px); max-height: 46%; overflow-y: auto; overscroll-behavior: contain;
  background: rgba(9, 22, 17, 0.88); backdrop-filter: blur(8px); border: 1px solid rgba(238,242,230,0.14); border-radius: 10px; padding: 8px 10px 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  animation: cs-in 0.22s ease-out; }
.callsheet.all { max-height: 72%; }
@keyframes cs-in { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
.cs-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 0 2px 8px; font-family: var(--f-data); }
.cs-head b { font: 700 19px/1 var(--f-data); text-transform: uppercase; letter-spacing: 0.04em; color: #ffe27a; }
.cs-who { color: var(--chalk-dim); font-size: 14px; text-transform: uppercase; letter-spacing: 0.06em; }
.cs-tabs { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(238,242,230,0.06); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.cs-tab { cursor: pointer; border: 0; background: none; color: var(--chalk-dim); font: 700 13px/1 var(--f-data); text-transform: uppercase; letter-spacing: 0.05em; padding: 7px 11px; border-radius: 999px; display: flex; gap: 5px; align-items: center; white-space: nowrap; flex: none; }
.cs-tab span { font-size: 11px; opacity: 0.7; }
.cs-tab:hover { color: var(--chalk); background: rgba(238,242,230,0.08); }
.cs-tab.on { background: var(--chalk); color: #10241a; }
.cs-formsel { flex-direction: row; align-items: center; gap: 6px; font: 600 12px/1 var(--f-data); text-transform: uppercase; letter-spacing: 0.06em; color: var(--chalk-dim); }
.cs-formsel select { padding: 5px 8px; font: 700 13px/1 var(--f-data); text-transform: uppercase; letter-spacing: 0.04em; border-radius: 6px; }
.cs-head .cs-all { margin-left: auto; }
/* The clock between plays: running or stopped, timeouts, the timeout button and the tempo. */
.cs-clock { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 0 2px 8px; font: 600 12px/1.2 var(--f-data); color: #c9d3cc; }
.cs-clock .cs-quicks { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.cs-quick.fit { border-color: var(--amber); }
.cs-clock .clk { text-transform: uppercase; letter-spacing: 0.05em; }
.cs-clock .clk.run { color: var(--amber); }
.cs-clock .clk.run::before { content: ''; display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--amber); animation: clk-pulse 1s ease-in-out infinite; }
@keyframes clk-pulse { 50% { opacity: 0.3; } }
.cs-tempo { display: inline-flex; gap: 6px; align-items: center; }
.cs-tempo select { font: inherit; }
.tos { display: inline-flex; gap: 3px; align-items: center; }
.tos i { width: 9px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.18); }
.tos i.on { background: #ffe27a; }
.bc-team .tos { margin-left: 2px; }
.bc-clock.run { color: #fff3c4; }
.sb-clock.run { color: var(--amber); }
.pcard.k-xp, .pcard.k-kickoff { --fam: #a7bba9; } .pcard.k-penalty { --fam: #ffd23f; }
.cs-flag .flagtxt { color: #ffe27a; font-weight: 600; } .cs-flag .flagtxt::before { content: ''; display: inline-block; width: 9px; height: 9px; margin-right: 7px; background: #ffd23f; transform: rotate(8deg); }
.lower3.flag { border-color: #ffd23f; } .lower3.flag .l3-head b { color: #ffd23f; } .pcard.k-spike, .pcard.k-kneel { --fam: #c792ff; }
@media (prefers-reduced-motion: reduce) { .cs-clock .clk.run::before { animation: none; } }
/* Powers: the carriers' meters between plays, the tag on a lineup spot, the scouting card. */
.cs-powers { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 0 2px 8px; font: 600 12px/1.2 var(--f-data); color: #c9d3cc; }
.cs-powers .pw-label, .cs-powers .pw-vs { text-transform: uppercase; letter-spacing: 0.05em; color: #ffd23f; }
.cs-powers .pw-vs { color: #c9d3cc; margin-left: 6px; }
.pw-chip { display: inline-flex; gap: 5px; align-items: center; padding: 3px 8px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--pw) 55%, transparent); background: rgba(0, 0, 0, .25); white-space: nowrap; }
.pw-chip b { font-weight: 700; color: #fff; }
.pw-chip.on { background: color-mix(in srgb, var(--pw) 32%, rgba(0,0,0,.3)); border-color: var(--pw); box-shadow: 0 0 10px color-mix(in srgb, var(--pw) 60%, transparent); }
.pw-chip.on::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--pw); box-shadow: 0 0 6px var(--pw); }
.pw-pips { display: inline-flex; gap: 2px; }
.pw-pips i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.18); }
.pw-pips i.on { background: var(--pw); }
.pw-pips i.num { width: auto; height: auto; border-radius: 0; background: none; font-style: normal; color: #c9d3cc; }
.pw-tag { display: block; font-size: 10px; font-weight: 700; letter-spacing: .03em; color: var(--pw); text-transform: uppercase; }
.pw-tag.dormant { opacity: .45; text-decoration: line-through; }
.pw-desc { border-left: 3px solid var(--pw); padding-left: 8px; margin: 6px 0; }
.pw-desc p { margin: 2px 0; }
.pw-log { font-weight: 700; color: var(--pw); }
.pw-log:not(.on) { opacity: .7; }
.pw-sig { font-style: normal; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 1px 5px; border-radius: 3px; background: var(--pw); color: #111; }
.cs-cards { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.cs-book { display: grid; gap: 8px; }
.cs-book h4 { margin: 0 0 4px; }
.cs-book .cs-cards { flex-wrap: wrap; overflow: visible; }
.pcard { position: relative; flex: none; width: clamp(118px, calc((100vw - 150px) / 8), 168px); display: grid; gap: 3px; text-align: left; cursor: pointer; padding: 6px 6px 8px; border-radius: 8px; color: var(--chalk);
  background: rgba(238, 242, 230, 0.05); border: 1px solid rgba(238, 242, 230, 0.12); border-bottom: 3px solid var(--fam, var(--chalk-dim)); transition: transform 0.1s, background 0.12s, box-shadow 0.12s; }
.pcard:hover, .pcard:focus-visible { background: rgba(238, 242, 230, 0.12); transform: translateY(-3px); box-shadow: 0 0 0 2px var(--fam) inset, 0 8px 18px rgba(0,0,0,0.3); outline: none; }
.pcard:active { transform: translateY(0); background: rgba(255, 181, 71, 0.25); }
.pcard.k-run { --fam: #ffc233; } .pcard.k-pass { --fam: #4fc3f7; } .pcard.k-punt, .pcard.k-fg { --fam: #a7bba9; }
.pcard.k-front { --fam: #ffc233; } .pcard.k-blitz { --fam: #ff5a4f; } .pcard.k-cover { --fam: #4fc3f7; }
.pcard.fit { box-shadow: 0 0 0 2px var(--amber) inset; }
.pc-art { position: relative; display: block; }
.pc-art kbd { position: absolute; top: 4px; right: 4px; font-size: 13px; padding: 2px 6px; background: rgba(9, 22, 17, 0.85); }
.pcard .fittag { position: absolute; top: 4px; left: 4px; font: 700 10px/1 var(--f-data); font-style: normal; text-transform: uppercase; letter-spacing: 0.06em; background: var(--amber); color: #1b1408; padding: 3px 5px; border-radius: 3px; }
.pcard .pname { font: 700 17px/1.05 var(--f-data); text-transform: uppercase; letter-spacing: 0.02em; padding: 2px 2px 0; }
.pc-top { display: flex; gap: 6px; align-items: center; padding: 0 2px; font: 600 11px/1 var(--f-data); text-transform: uppercase; letter-spacing: 0.06em; color: var(--chalk-dim); }
.pc-kind { font-style: normal; color: #10241a; background: var(--fam); padding: 2px 5px; border-radius: 3px; font-weight: 700; }
.pc-form { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc-way { color: #ffd23f; font-weight: 700; }
.cs-flip[aria-pressed="true"] { background: #ffd23f; color: #1a1a1a; }
.pcard .pblurb { display: none; font-size: 12px; line-height: 1.2; color: var(--chalk-dim); padding: 0 2px; }
.callsheet.all .pcard .pblurb { display: block; }
.pdiag { width: 100%; height: auto; aspect-ratio: 46 / 33; display: block; background: linear-gradient(#2f7a45, #2a6f3f); border-radius: 5px; }
.pdiag .los { stroke: #6fb0ff; stroke-width: 0.45; }
.pdiag .o { fill: rgba(238,242,230,0.4); }
.pdiag .o.on { fill: #ffffff; stroke: #0d2b20; stroke-width: 0.3; }
.pdiag .x { stroke: rgba(238,242,230,0.4); stroke-width: 0.45; fill: none; }
.pdiag .x.on { stroke: #ffffff; stroke-width: 0.6; }
/* Result lower third: shown after the whistle, never during the play */
.lower3 { position: absolute; left: 16px; bottom: calc(18px + var(--dock, 0px)); z-index: 4; pointer-events: none; width: min(460px, calc(100% - 32px)); padding: 10px 14px 10px 16px; border-radius: 6px;
  background: rgba(9, 22, 17, 0.9); border-left: 5px solid var(--chalk-dim); box-shadow: 0 8px 24px rgba(0,0,0,0.35); opacity: 0; transform: translateX(-24px); transition: opacity 0.22s, transform 0.22s, bottom 0.22s; }
.lower3.on { opacity: 1; transform: none; }
.lower3.td { border-color: var(--amber); } .lower3.to { border-color: var(--bad); } .lower3.big { border-color: var(--good); } .lower3.muted { border-color: rgba(238,242,230,0.35); }
.lower3.poss { background: linear-gradient(90deg, rgba(120, 28, 24, 0.92), rgba(9, 22, 17, 0.92)); }
.l3-head { display: flex; gap: 12px; align-items: baseline; }
.l3-head b { font: 700 24px/1 var(--f-data); text-transform: uppercase; letter-spacing: 0.04em; }
.lower3.td .l3-head b { color: var(--amber); } .lower3.to .l3-head b { color: #ff8b7f; } .lower3.big .l3-head b { color: var(--good); }
.l3-yds { font: 700 20px/1 var(--f-data); color: var(--chalk); }
.l3-clock { margin-left: auto; font: 600 11px/1 var(--f-data); text-transform: uppercase; letter-spacing: 0.08em; color: var(--chalk-dim); }
.l3-text { margin: 6px 0 0; font-size: 14px; line-height: 1.3; }
.l3-note { margin: 4px 0 0; font-size: 13px; color: var(--amber); display: flex; gap: 6px; align-items: baseline; }
.l3-tag { flex: none; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 1px 5px; border-radius: 3px; background: rgba(255, 181, 46, .18); color: var(--amber); }
.l3-tag.ability { background: rgba(147, 197, 253, .18); color: #93c5fd; }
.l3-tag.size { background: rgba(255, 255, 255, .12); color: #e5e7eb; }
.l3-tag.weather { background: rgba(94, 234, 212, .16); color: #5eead4; }
.l3-tag.power { background: rgba(255, 210, 63, .22); color: #ffd23f; }
.l3-tag.powerOff { background: rgba(255, 255, 255, .1); color: #c9d1ce; }
.l3-next { margin: 6px 0 0; font: 600 13px/1 var(--f-data); text-transform: uppercase; letter-spacing: 0.08em; color: var(--chalk-dim); }
@media (prefers-reduced-motion: reduce) { .lower3 { transition: none; } }
/* Debug HUD: developer only */
.dbg-hud { position: absolute; right: 12px; top: 60px; z-index: 6; width: min(420px, 46%); max-height: calc(100% - 80px); overflow: auto; pointer-events: none; font: 11px/1.3 ui-monospace, Menlo, monospace;
  background: rgba(0, 0, 0, 0.72); color: #dfe; padding: 6px 8px; border-radius: 4px; }
.dbg-hud:empty { display: none; }
.dbg-hud p { margin: 0 0 4px; } .dbg-hud table { border-collapse: collapse; width: 100%; } .dbg-hud td { padding: 0 4px; white-space: nowrap; }
.dbg-hud tr.def td { color: #ffc9c0; } .dbg-hud ol { margin: 4px 0 0; padding-left: 14px; } .dbg-hud li span { color: #9ab; }
.modes .btn { min-width: 64px; }
.mode-note { margin: 0; }
/* Folded call sheet */
.callsheet.folded { width: auto; padding: 8px 12px; }
.callsheet.folded .cs-cards, .callsheet.folded .cs-book, .callsheet.folded .cs-tabs, .callsheet.folded .cs-formsel, .callsheet.folded .cs-all { display: none; }
.cs-fold { margin-left: 6px; }
/* Debug view */
.dbg { align-self: start; justify-self: start; z-index: 4; margin: 120px 0 0 12px; width: min(300px, calc(100% - 24px)); padding: 10px 12px; display: grid; gap: 6px; background: rgba(9, 22, 17, 0.92); font-size: 13px; }
.dbg h4 { margin: 2px 0 0; display: flex; gap: 8px; align-items: baseline; }
.dbg .bad { color: var(--bad); } .dbg .good { color: var(--good); }
.dbg .cal { display: grid; grid-template-columns: 92px 1fr 52px; gap: 6px; align-items: center; }
.dbg output { font: 600 12px/1 var(--f-data); text-align: right; }
/* Lined up / waiting / final */
.pill { align-self: end; justify-self: center; z-index: 3; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px; border-radius: 999px;
  background: rgba(9, 22, 17, 0.86); backdrop-filter: blur(8px); border: 1px solid rgba(238,242,230,0.16); box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
.pill .pl-play { font: 700 16px/1 var(--f-data); text-transform: uppercase; letter-spacing: 0.05em; display: grid; gap: 3px; }
.pill .pl-play small { font: 600 11px/1 var(--f-data); color: var(--chalk-dim); letter-spacing: 0.08em; }
.pill .btn { border-radius: 999px; }
.pill.wait { padding: 10px 18px; font: 600 14px/1 var(--f-data); text-transform: uppercase; letter-spacing: 0.08em; color: var(--chalk-dim); }
/* Watch mode (spectator / streamer): the broadcast scoreboard grows, the menu fades back, and
   the only other HUD is one chip in the bottom-left corner. */
.game.spectate .bcast { margin-top: 16px; border-radius: 8px; }
.game.spectate .bc-row { height: 60px; }
.game.spectate .bc-team::before { width: 72px; }
.game.spectate .bc-strip { font-size: 16px; padding: 6px 16px; }
.game.spectate .bc-abbr { width: 72px; font-size: 26px; }
.game.spectate .bc-team { background: linear-gradient(90deg, var(--team) 0 72px, rgba(255,255,255,0.04) 72px); padding-right: 24px; }
.game.spectate .bc-score { font-size: 38px; }

.cs-scout h4 { margin: 0 0 4px; }
.cs-scout ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.cs-scout .tend { border: 0; padding: 0; font-size: 13px; }
/* Lined up: the pre-snap adjustments over the snap pill. */
.lined3 { align-self: end; justify-self: center; z-index: 3; margin-bottom: 16px; display: grid; gap: 6px; justify-items: center; max-width: calc(100% - 24px); }
.lined3 .pill { margin: 0; }
.ps-bar, .ps-pick { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 6px; border-radius: 10px; background: rgba(9, 22, 17, 0.82); backdrop-filter: blur(8px); border: 1px solid rgba(238,242,230,0.14); }
.ps-bar .btn.on, .ps-pick .btn.on { border-color: var(--amber); color: var(--amber); }
.ps-pick .btn.fit { box-shadow: 0 0 0 1px var(--amber) inset; }
.ps-pick .fittag { font: 700 9px/1 var(--f-data); font-style: normal; text-transform: uppercase; background: var(--amber); color: #1b1408; padding: 2px 4px; border-radius: 3px; }
.game.g3d .stage-slot:has(.lined3) .hud-tip { display: none; }
@media (max-width: 900px) { .cs-scout { grid-template-columns: minmax(0, 1fr); } }
@media (pointer: coarse) { .ps-bar kbd, .ps-pick kbd, .cs-chip kbd { display: none; } }
/* Game skin: the console-sports look over every screen. A night stadium behind the menus, the
   franchise's colors (--me, --me2, set from the user's kit in app.js) on the top bar, the panels'
   edge and the active tab, beveled panels and buttons, foil player cards and badges. It only
   restyles: the layout rules above still decide where everything goes. */
:root { --me: #e5402b; --me2: #ffb547; --me-ink: #fff; --panel-hi: rgba(255, 255, 255, 0.07); --gold: linear-gradient(135deg, #fff0b3, #ffc44d 40%, #e8901c); }
html { background: #07140e; }
body { min-height: 100vh; background: transparent; }
/* The backdrop is a fixed layer rather than a fixed background, which phones ignore. */
body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none; background:
  radial-gradient(1100px 480px at 50% -140px, rgba(255, 244, 214, 0.16), transparent 70%),
  radial-gradient(700px 420px at -6% -4%, color-mix(in srgb, var(--me) 20%, transparent), transparent 70%),
  radial-gradient(700px 420px at 106% -4%, color-mix(in srgb, var(--me2) 14%, transparent), transparent 70%),
  repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.017) 0 90px, transparent 90px 180px),
  linear-gradient(180deg, #113a29 0, #0b271b 55%, #07140e 100%); }
body.g3d-on::before { background: #07140e; }

/* Top bar: a full-width glass strip with the franchise stripe under it. */
.top { max-width: none; margin: 0 -24px 24px; padding: 10px max(24px, calc(50% - 596px)); border-bottom: 0;
  background: linear-gradient(180deg, rgba(5, 14, 10, 0.96), rgba(9, 26, 18, 0.92)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); }
.top::after { content: ''; position: absolute; left: 0; right: 0; bottom: -3px; height: 3px; pointer-events: none;
  background: linear-gradient(90deg, var(--me), var(--me2) 55%, transparent); }
body.g3d-on .top { margin-inline: -8px; }
.brand { font-size: 24px; letter-spacing: 0.02em; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.45); }
.brand .ball { width: 26px; height: 26px; box-shadow: inset 0 0 0 2px var(--turf-deep), 0 0 14px rgba(229, 64, 43, 0.45); transition: transform 0.5s cubic-bezier(.3, 1.6, .5, 1); }
.brand .ball::after { inset: 8px; }
.brand:hover .ball { transform: rotate(200deg); }
.nav { position: relative; isolation: isolate; padding: 9px 14px; border-radius: 0; transition: color 0.15s; }
.nav::before { content: ''; position: absolute; inset: 0; z-index: -1; transform: skewX(-14deg); border-radius: 3px; transition: background 0.15s, box-shadow 0.15s; }
.nav:hover { background: none; }
.nav:hover::before { background: rgba(255, 255, 255, 0.08); }
.nav.on { box-shadow: none; color: var(--me-ink); text-shadow: 0 1px 0 rgba(0, 0, 0, 0.3); }
.nav.on::before { background: linear-gradient(180deg, color-mix(in srgb, var(--me) 82%, #fff), var(--me) 55%, color-mix(in srgb, var(--me) 80%, #000));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2), inset 0 -3px 0 var(--me2), 0 4px 14px color-mix(in srgb, var(--me) 45%, transparent); }
.nav[data-to="game"]::after { content: ''; display: inline-block; width: 7px; height: 7px; margin-left: 7px; border-radius: 50%; background: #ff4b3a; box-shadow: 0 0 8px #ff4b3a; vertical-align: 1px; animation: clk-pulse 1.2s ease-in-out infinite; }
.top-team { margin-left: auto; display: flex; gap: 8px; align-items: center; padding: 4px 12px 4px 4px; border-radius: 999px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); }
.top-team > span { display: grid; line-height: 1.05; }
.top-team b { font: 700 14px/1.1 var(--f-data); text-transform: uppercase; letter-spacing: 0.04em; }
.top-team small { font: 600 11px/1.1 var(--f-data); color: var(--chalk-dim); text-transform: uppercase; letter-spacing: 0.08em; }
.top-team .tbadge { font-size: 13px; padding: 5px 6px; border-radius: 50%; min-width: 34px; text-align: center; }
/* The speaker sits beside the team chip; the chip takes the spare space. */
.top-team ~ .sndwrap { margin-left: 10px; }

/* Screen titles: chrome lettering on a franchise slash. */
main h1 { background: linear-gradient(180deg, #ffffff 35%, #c7d8c6 70%, #9fb7a2); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.45)); padding-bottom: 2px; }
main section > h1::after, main .draft-head h1::after, main .kit-head h1::after { content: ''; display: block; width: 110px; height: 5px; margin-top: 10px;
  background: linear-gradient(90deg, var(--me) 0 64%, var(--me2) 64%); transform: skewX(-24deg); transform-origin: left; }
.eyebrow::before { content: ''; display: inline-block; width: 7px; height: 7px; margin-right: 8px; background: var(--amber); transform: rotate(45deg); vertical-align: 2px; box-shadow: 0 0 8px rgba(255, 181, 71, 0.7); }
h2 { text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35); }

/* Panels */
.card { position: relative; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.09);
  background: linear-gradient(180deg, rgba(38, 90, 66, 0.78), rgba(17, 46, 33, 0.9) 140px, rgba(13, 38, 27, 0.92));
  box-shadow: inset 0 1px 0 var(--panel-hi), 0 12px 30px rgba(0, 0, 0, 0.28); }
.card::before { content: ''; position: absolute; left: -1px; right: -1px; top: -1px; height: 3px; border-radius: 10px 10px 0 0; pointer-events: none;
  background: linear-gradient(90deg, var(--me), color-mix(in srgb, var(--me2) 80%, transparent) 30%, transparent 70%); }
.card > h3:first-child { margin: -16px -16px 2px; padding: 13px 16px 10px 28px; color: var(--chalk); border-bottom: 1px solid rgba(255, 255, 255, 0.07); border-radius: 10px 10px 0 0;
  background: linear-gradient(var(--me), var(--me)) 16px 50% / 4px 14px no-repeat, linear-gradient(90deg, rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0.06)); }
.card > h2:first-child { padding-bottom: 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.07); }
hr { border-top-color: rgba(255, 255, 255, 0.08); }

/* Buttons: beveled, with a shine that sweeps across on hover. */
.btn { position: relative; overflow: hidden; border-radius: 5px; border: 1px solid rgba(255, 255, 255, 0.14);
  background: linear-gradient(180deg, #2f7052, #1e4c39 60%, #1a4232);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 2px 0 rgba(0, 0, 0, 0.4), 0 6px 14px rgba(0, 0, 0, 0.2); text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
  transition: transform 0.08s, filter 0.15s, box-shadow 0.15s; }
.btn::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(110deg, transparent 35%, rgba(255, 255, 255, 0.24) 50%, transparent 65%); transform: translateX(-120%); }
.btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.1); border-color: rgba(255, 255, 255, 0.3); }
.btn:hover:not(:disabled)::after { transform: translateX(120%); transition: transform 0.55s ease-out; }
.btn:active:not(:disabled) { transform: translateY(1px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 0 0 rgba(0, 0, 0, 0.4); }
.btn.primary { background: linear-gradient(180deg, #ff7356, #e5402b 55%, #c42f1c); border-color: #ff8d72; color: #fff;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 2px 0 #7c1c10, 0 6px 18px rgba(229, 64, 43, 0.35); }
.btn.danger { background: linear-gradient(180deg, #ff8f80, #e0503f); }
.btn.ghost { background: rgba(255, 255, 255, 0.03); box-shadow: none; text-shadow: none; }
.btn:disabled { filter: saturate(0.4); box-shadow: none; }
.gm-row .btn.on, .kit-form .gm-row .btn.on, .chant .btn.on { background: var(--gold); color: #2a1a04; border-color: #ffe08a; text-shadow: none; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 0 14px rgba(255, 196, 77, 0.35); }

/* Badges: gold hexagons for elite overalls, glossy type chips, team badges with their stripe. */
.ovr { border-radius: 4px; }
.ovr.elite { background: var(--gold); color: #2a1a04; clip-path: polygon(18% 0, 82% 0, 100% 50%, 82% 100%, 18% 100%, 0 50%); padding-inline: 8px; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45); }
.ovr.good, .ovr.ok { background: rgba(0, 0, 0, 0.22); box-shadow: inset 0 0 0 1px color-mix(in srgb, currentColor 30%, transparent); }
.type { border-radius: 999px; padding: 3px 8px 2px; color: #fff; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.5);
  background: linear-gradient(180deg, color-mix(in srgb, var(--tc) 88%, #fff), color-mix(in srgb, var(--tc) 72%, #000));
  border-color: color-mix(in srgb, var(--tc) 60%, #fff); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25); }
.tbadge { background: linear-gradient(180deg, color-mix(in srgb, var(--team) 80%, #fff), var(--team) 45%, color-mix(in srgb, var(--team) 78%, #000));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), inset 0 -2px 0 rgba(0, 0, 0, 0.3); }
.tabbr { background: linear-gradient(180deg, color-mix(in srgb, var(--team) 80%, #fff), var(--team) 50%, color-mix(in srgb, var(--team) 75%, #000));
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.3), 0 6px 16px color-mix(in srgb, var(--team) 40%, transparent); }
.bar { background: rgba(0, 0, 0, 0.35); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4); }
.bar span { background: linear-gradient(90deg, var(--good), #c5f27a); }
.capbar span { background: var(--gold); }
.spr { filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.35)); }

/* Tables: a header bar, striped rows, a glow on hover and the user's team in its colors. */
th { background: rgba(0, 0, 0, 0.22); border-bottom-color: rgba(255, 255, 255, 0.1); }
tbody tr:nth-child(even) td { background: rgba(255, 255, 255, 0.022); }
tbody tr:hover td { background: rgba(255, 255, 255, 0.05); }
td { border-bottom-color: rgba(255, 255, 255, 0.06); }
.gtable tr.me td, .stand tr.me td { background: color-mix(in srgb, var(--me) 20%, transparent); }
.gtable tr.me td:first-child, .stand tr.me td:first-child { box-shadow: inset 4px 0 0 var(--me); }
.board-table thead th { background: #163a2a; }
.board-table tr.sel td { background: color-mix(in srgb, var(--me) 22%, transparent); }
.board-table tr.sel td:first-child { box-shadow: inset 4px 0 0 var(--me); }

/* Forms */
input, select, textarea { background: rgba(4, 14, 9, 0.6); border-color: rgba(255, 255, 255, 0.12); box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3); transition: border-color 0.15s, box-shadow 0.15s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--amber); box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3), 0 0 0 3px rgba(255, 181, 71, 0.18); }
input[type="checkbox"], input[type="radio"], input[type="range"] { accent-color: var(--amber); box-shadow: none; }
label.pill, .schemepick { background: rgba(4, 14, 9, 0.5); transition: border-color 0.15s, background 0.15s, box-shadow 0.15s; }
label.pill:hover, .schemepick:hover { border-color: rgba(255, 255, 255, 0.3); }
label.pill:has(input:checked), .schemepick:has(input:checked) { background: linear-gradient(90deg, rgba(255, 181, 71, 0.16), rgba(255, 181, 71, 0.04)); box-shadow: 0 0 0 1px var(--amber), 0 0 14px rgba(255, 181, 71, 0.15); }
kbd { background: linear-gradient(180deg, #24493a, #10281d); border-color: rgba(255, 255, 255, 0.2); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.5); }

/* Home: a title screen. */
.hero { position: relative; overflow: hidden; isolation: isolate; padding: 34px 30px 28px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.1);
  background: radial-gradient(600px 300px at 80% 20%, color-mix(in srgb, var(--me) 30%, transparent), transparent 70%),
    linear-gradient(115deg, rgba(5, 16, 11, 0.85) 0 45%, rgba(18, 54, 38, 0.6)),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0 2px, transparent 2px 64px);
  box-shadow: inset 0 1px 0 var(--panel-hi), 0 20px 50px rgba(0, 0, 0, 0.4); }
.hero::after { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, 0.07) 50%, transparent 60%); animation: hero-sweep 6s ease-in-out infinite; }
@keyframes hero-sweep { 0%, 30% { transform: translateX(-100%); } 70%, 100% { transform: translateX(100%); } }
.hero-ball { position: absolute; z-index: -1; right: -70px; top: -60px; width: 340px; height: 340px; border-radius: 50%; opacity: 0.16; pointer-events: none;
  background: radial-gradient(circle, #fff 0 13%, #0a1a12 13% 19%, transparent 19%), linear-gradient(var(--me) 0 46%, #0a1a12 46% 54%, #fff 54%);
  box-shadow: inset 0 0 0 10px #0a1a12; animation: ball-spin 40s linear infinite; }
@keyframes ball-spin { to { transform: rotate(360deg); } }
.hero h1 { font-size: clamp(34px, 6.4vw, 68px); }
.hero h1::after { width: 160px; height: 6px; }
.hero .lede { color: #c8d6c9; }
.showcase { gap: 12px; }
.showcase figure { position: relative; overflow: hidden; min-width: 104px; padding: 12px 12px 10px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--tc) 55%, rgba(255, 255, 255, 0.2));
  background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--tc) 45%, transparent), transparent 70%), linear-gradient(160deg, color-mix(in srgb, var(--tc) 35%, #0c2016), #0a1c14);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 8px 20px rgba(0, 0, 0, 0.35); transition: transform 0.2s, box-shadow 0.2s; }
.showcase figure::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, 0.18) 45%, transparent 60%); transform: translateX(-100%); transition: transform 0.6s; }
.showcase figure:hover { transform: translateY(-4px) rotate(-1deg); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 14px 28px rgba(0, 0, 0, 0.45), 0 0 18px color-mix(in srgb, var(--tc) 40%, transparent); }
.showcase figure:hover::after { transform: translateX(100%); }
.showcase .spr { width: 72px; height: 72px; filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.5)); }
.showcase figcaption b { background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent; }
.setup .btn.primary { font-size: 18px; padding: 14px 28px; letter-spacing: 0.06em; }
.saveslots .sslot { grid-template-columns: 44px minmax(0, 1fr); background: rgba(4, 14, 9, 0.45); border-color: rgba(255, 255, 255, 0.08); transition: border-color 0.15s, transform 0.15s; }
.saveslots .sslot:not(.empty):hover { border-color: rgba(255, 255, 255, 0.25); transform: translateX(2px); }
.saveslots .sslot.on { border-color: var(--me); box-shadow: inset 0 0 0 1px var(--me), 0 0 16px color-mix(in srgb, var(--me) 25%, transparent); }
.saveslots .sn { grid-row: span 2; align-self: stretch; display: grid; place-items: center; font: 400 22px/1 var(--f-display); border-radius: 6px; background: rgba(0, 0, 0, 0.3); color: var(--amber); }
.saveslots .sslot.empty .sn { grid-row: auto; color: var(--chalk-dim); }
.saveslots .sslot.empty { border-style: dashed; }

/* Draft room: the on-the-clock banner. */
.draft-head { padding: 16px 20px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
  background: linear-gradient(100deg, color-mix(in srgb, var(--me) 30%, #08170f), rgba(8, 23, 15, 0.9) 55%), repeating-linear-gradient(-60deg, rgba(255, 255, 255, 0.03) 0 10px, transparent 10px 20px);
  box-shadow: inset 0 1px 0 var(--panel-hi), 0 12px 30px rgba(0, 0, 0, 0.3); }
.clockbox { padding: 10px 14px; border-radius: 8px; background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(255, 255, 255, 0.08); }
.clockbox.live { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber), 0 0 22px rgba(255, 181, 71, 0.3); animation: clock-glow 1.6s ease-in-out infinite; }
.clockbox .clocknum { text-shadow: 0 0 14px rgba(255, 181, 71, 0.6); }
@keyframes clock-glow { 50% { box-shadow: 0 0 0 1px var(--amber), 0 0 6px rgba(255, 181, 71, 0.15); } }
.slots li { padding: 1px 4px; border-radius: 3px; }
.slots li:has(.spr) { background: rgba(255, 255, 255, 0.04); }
.dhead { padding: 10px; margin: -6px -6px 0; border-radius: 8px; background: radial-gradient(circle at 15% 50%, rgba(255, 255, 255, 0.1), transparent 50%), rgba(0, 0, 0, 0.2); }
.dhead .spr.lg { width: 96px; height: 96px; filter: drop-shadow(0 6px 6px rgba(0, 0, 0, 0.5)); }

/* Depth chart: player cards on the field. */
.gridiron { border-radius: 12px; box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.35), 0 14px 34px rgba(0, 0, 0, 0.35); }
.dslot { position: relative; overflow: hidden; border-radius: 8px; border-color: rgba(255, 255, 255, 0.16);
  background: linear-gradient(180deg, rgba(20, 50, 36, 0.95), rgba(7, 20, 14, 0.95)); box-shadow: inset 0 3px 0 var(--me), 0 6px 14px rgba(0, 0, 0, 0.35); transition: transform 0.12s, box-shadow 0.12s; }
.dslot.def { box-shadow: inset 0 3px 0 var(--me2), 0 6px 14px rgba(0, 0, 0, 0.35); }
.dslot:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.4); }
.dslot.sel { box-shadow: 0 0 0 2px var(--amber), 0 0 18px rgba(255, 181, 71, 0.5); }
.unitbar > div { padding: 8px 14px; border-radius: 8px; background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255, 255, 255, 0.07); }
.unitbar b { text-shadow: 0 0 12px rgba(255, 181, 71, 0.4); }

/* Season hub: the game-day matchup. */
.card.matchup { background: radial-gradient(500px 200px at 50% 0, color-mix(in srgb, var(--me) 22%, transparent), transparent 70%), linear-gradient(180deg, rgba(38, 90, 66, 0.8), rgba(13, 38, 27, 0.94)); }
.matchup .vs { padding: 6px 0; }
.matchup .tabbr { font-size: 26px; padding: 10px 12px 8px; }
.matchup .at { font-size: 20px; color: var(--amber); }
.results li.mine, .headlines li.mine, .health li.me, .capall li.me, .faLog li.me { box-shadow: inset 3px 0 0 var(--me); }
.bgame { border-radius: 8px; background: linear-gradient(180deg, rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.2)); box-shadow: inset 0 1px 0 var(--panel-hi); }
.bteam.me { box-shadow: inset 3px 0 0 var(--me); }
.champ { background: radial-gradient(500px 220px at 50% 0, rgba(255, 196, 77, 0.25), transparent 70%), linear-gradient(180deg, rgba(38, 90, 66, 0.8), rgba(13, 38, 27, 0.94)); }
.champ h2 { background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 30px; }
.edge { border-radius: 6px; }
.tside { border-radius: 8px; background: rgba(0, 0, 0, 0.28); box-shadow: inset 0 1px 0 var(--panel-hi); }
.verdict { border-radius: 0 6px 6px 0; background: rgba(0, 0, 0, 0.2); }
.rivalry .rv-head b { background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stadium { transition: transform 0.12s, border-color 0.15s; }
.stadium:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.3); }

/* Screens slide in; the panels follow one after another. */
main.enter > section { animation: scr-in 0.32s ease-out; }
main.enter .card { animation: card-in 0.4s ease-out backwards; }
main.enter .col > :nth-child(2), main.enter .cards > :nth-child(2) { animation-delay: 0.05s; }
main.enter .col > :nth-child(3) { animation-delay: 0.1s; }
main.enter .col > :nth-child(n+4) { animation-delay: 0.14s; }
@keyframes scr-in { from { opacity: 0; transform: translateX(14px); } }
@keyframes card-in { from { opacity: 0; transform: translateY(10px); } }

/* In the game: the call sheet, menu, pause and final card in the same skin. */
.callsheet, .gmenu, .ov-final, .film { border-top: 3px solid var(--me); box-shadow: inset 0 1px 0 var(--panel-hi), 0 14px 36px rgba(0, 0, 0, 0.45); }
.callsheet { background: linear-gradient(180deg, rgba(14, 34, 25, 0.92), rgba(7, 18, 13, 0.92)); }
.cs-head b { text-shadow: 0 0 12px rgba(255, 226, 122, 0.35); }
.cs-tab.on { background: linear-gradient(180deg, #ffffff, #d5e2d4); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); }
.pcard { background: linear-gradient(180deg, rgba(238, 242, 230, 0.08), rgba(238, 242, 230, 0.02)); }
.pcard:hover, .pcard:focus-visible { box-shadow: 0 0 0 2px var(--fam) inset, 0 8px 18px rgba(0, 0, 0, 0.3), 0 0 16px color-mix(in srgb, var(--fam) 35%, transparent); }
.pcard .pname { text-shadow: 0 1px 0 rgba(0, 0, 0, 0.4); }
