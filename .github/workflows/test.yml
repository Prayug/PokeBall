name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only src/ and test/: the tests never load dist/, so skip downloading its 3D models.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            src
            test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The simulation tests import src/ directly and need no npm packages (three.js is only
      # used by the 3D field, which these tests never load).
      - name: Complete plays
        run: node test/plays.mjs
      - name: Scenarios
        run: node test/scenarios.mjs
      - name: Formations
        run: node test/formations.mjs
      - name: League mode
        run: node test/league.mjs
      - name: Abilities, type theater and weather
        run: node test/abilities.mjs
      - name: Franchise kits and the broadcast package
        run: node test/broadcast.mjs
      - name: Powers
        run: node test/powers.mjs
      - name: Two players in one play
        run: node test/controls.mjs
      - name: Pre-snap adjustments and difficulty
        run: node test/presnap.mjs
      - name: Live kicks
        run: node test/kicks.mjs
      - name: Clock rules
        run: node test/clock.mjs
      - name: Penalties
        run: node test/penalties.mjs
      - name: Replay review and the film room's tape
        run: node test/review.mjs
      - name: Football IQ
        run: node test/iq.mjs 600 --strict
      - name: Gameplay feel (movement, spacing, blocks, coverage reactions, tackles, possession)
        run: node test/feel.mjs 300 --strict
